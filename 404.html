<!DOCTYPE html>
<html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/style.css"/>

<body>

    <img src="images/logo.png" alt="Kodomo! Logo" class="logo">
