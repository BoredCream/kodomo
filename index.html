<!DOCTYPE html>
<html>
<head>
  <title>Kodomo!</title>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/style.css"/>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="stylesheet" href="css/all.min.css">
</head>
<body>
  <header class="site-header">
    <img src="images/logo.png" alt="Kodomo! Logo" class="logo">
  </header>
<audio src="bgm.m4a" autoplay loop id="bgm"></audio>

    <main class="profile-card">
    <div class="profile-info-group">
      <img src="images/BoredCreamPFP.gif" alt="Profile Picture" class="profile-pfp">
      <h2 class="profile-name">Username</h2>
      <p class="profile-bio">Hellow, this is a bio. blah blah. anything goes here. blah.,yu can find my socials/contacts below</p>
    </div>
    
    <nav class="button-container">
      <a href="https://cunny.beauty" target="_blank" rel="noopener noreferrer">
        <button class="nav-button"><img src="images/AkkomaButton.png" alt="" class="button-icon"> Socials</button>
      </a>
      <a href="mailto:mercy@kodomo.moe">
        <button class="nav-button"><i class="fa-solid fa-envelope"></i> Email</button>
      </a>
      <a href="https://keys.openpgp.org/vks/v1/by-fingerprint/E67963C9675A7B1B8690DE91FC8AD0D606984519" target="_blank" rel="noopener noreferrer">
        <button class="nav-button"><i class="fa-solid fa-key"></i> PGP</button>
      </a>
      
      <div class="fingerprint-box" onclick="copyFingerprint()" style="cursor: pointer;">
        <span class="fingerprint-label">PGP Fingerprint (Click to Copy):</span>
        <code class="fingerprint-text" id="pgp-text">e67963c9675a7b1b8690de91fc8ad0d606984519</code>
      </div>
    </nav>
  </main>
</body>
<script>
  const audio = document.getElementById('bgm');
  
  function startAudio() {
      if (audio.paused) {
          audio.play().then(() => {
              cleanUpListeners();
          }).catch(error => {
              console.log("Playback blocked until explicit interaction.");
          });
      }
  }

  function cleanUpListeners() {
      window.removeEventListener('click', startAudio);
      window.removeEventListener('touchstart', startAudio);
      window.removeEventListener('pointermove', startAudio);
      window.removeEventListener('scroll', startAudio);
  }

  window.addEventListener('click', startAudio);
  window.addEventListener('touchstart', startAudio);
  window.addEventListener('pointermove', startAudio);
  window.addEventListener('scroll', startAudio);
</script>
<script>
function copyFingerprint() {
    const text = document.getElementById('pgp-text').innerText;
    navigator.clipboard.writeText(text).catch(err => {
        console.error('Failed to copy text: ', err);
    });
}
</script>
</html>
